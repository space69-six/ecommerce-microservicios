spring.application.name=ms-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=ms-auth
spring.cloud.gateway.routes[0].uri=lb://ms-auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=ms-usuarios
spring.cloud.gateway.routes[1].uri=lb://ms-usuarios
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[2].id=ms-catalogo
spring.cloud.gateway.routes[2].uri=lb://ms-catalogo
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/catalogo/**

spring.cloud.gateway.routes[3].id=ms-inventario
spring.cloud.gateway.routes[3].uri=lb://ms-inventario
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inventario/**

spring.cloud.gateway.routes[4].id=ms-carrito
spring.cloud.gateway.routes[4].uri=lb://ms-carrito
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/carrito/**

spring.cloud.gateway.routes[5].id=ms-pedidos
spring.cloud.gateway.routes[5].uri=lb://ms-pedidos
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.routes[6].id=ms-pagos
spring.cloud.gateway.routes[6].uri=lb://ms-pagos
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/pagos/**

spring.cloud.gateway.routes[7].id=ms-notificaciones
spring.cloud.gateway.routes[7].uri=lb://ms-notificaciones
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notificaciones/**